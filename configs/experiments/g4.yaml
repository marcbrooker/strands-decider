# g4: g3 with gemma-4-31B-it as the teacher in place of the frozen-torso anchor. The 31B
# model's own reading (chat template, <bos>, answer letters, soft-capped; data/teacher.py)
# labels every training row except the multi-step rows, which keep v14's replay targets;
# rating-scale rows train on gold alone. kl_frozen_weight 0 removes the anchor. Teacher file
# built by training/merge_teacher_g4.py (`training/recipe.sh teacher31b`). Everything else
# is g3's (hobson-gemma4). Pre-registered in research/preregistrations/PREREGISTRATION-g4.md.
train_files: ["data/train_v5.jsonl", "data/multistep_v14.jsonl", "data/generated_v16.jsonl",
              "data/generated_v18.jsonl", "data/adequacy_hs2.jsonl", "data/adequacy_gen.jsonl"]
val_fraction: 0.03

base_model: "google/gemma-4-E2B-it"
num_slots: 24           # must match `data build --max-options`; also the KL reference width
head_type: "pointer"    # scores each option from its own hidden state; see modeling.PointerHead
pointer_dim: 256
head_init: "random"     # "lm_head" seeding applies to the slot head only
kl_frozen_weight: 0.0   # no frozen-torso anchor: the 31B teacher replaces it
teacher_file: "data/teacher_g4.jsonl"   # 31B on all but multi-step (v14 replay) and score rows
teacher_weight: 1.0
head_dropout: 0.05
max_length: 4096        # the serving default; no training row is near it
host_embeddings: true   # the per-layer embedding table in host memory (one GPU)
force_bos: true         # prepend <bos>: the -it tokenizer adds none of its own

use_lora: true
lora_r: 16
lora_alpha: 32
lora_targets: ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "up_proj", "down_proj"]
freeze_torso: false

epochs: 1
micro_batch_size: 8
grad_accum: 4           # effective batch 32
lr: 0.0001              # LoRA
head_lr: 0.001          # randomly-initialised head needs a bigger step
weight_decay: 0.01
warmup_ratio: 0.03
max_grad_norm: 1.0
gradient_checkpointing: true

shuffle_options: true
group_by_length: true
ordinal_smoothing: 0.1
reverse_score_prob: 0.5

output_dir: "checkpoints/hobson-e2b-g4"
seed: 0
log_every: 20
eval_every: 500
